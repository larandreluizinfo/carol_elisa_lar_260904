<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Jogo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(180deg, #4169E1 0%, #7B68EE 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
        }
        a {
            color: white;
            font-size: 18px;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 10px;
        }
        a:hover {
            background: white;
            color: #4169E1;
        }
    </style>
</head>
<body>
    <h1>🚧 Em breve</h1>
