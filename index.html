<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha um Jogo!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
        }
        h1 {
            color: #FF1493;
            font-size: 48px;
            margin-bottom: 40px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }
        .menu {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-card {
            width: 280px;
            height: 340px;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 5px solid white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        .game-card:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
        }
        .game-card .emoji {
            font-size: 80px;
            margin-bottom: 15px;
        }
        .game-card h2 {
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }
        .game-card p {
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            font-size: 16px;
        }
        .game1 {
            background: linear-gradient(180deg, #FF69B4, #FF1493);
        }
        .game2 {
            background: linear-gradient(180deg, #4169E1, #7B68EE);
        }
        @media (max-width: 700px) {
            h1 {
                font-size: 32px;
            }
            .menu {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h1>🎮 Escolha um Jogo!</h1>
    <div class="menu">
        <div class="game-card game1" onclick="window.location.href='carol.html'">
            <div class="emoji">🌺</div>
            <h2>Carol no Paraíso</h2>
            <p>Pule as colmeias!</p>
        </div>
        <div class="game-card game2" onclick="window.location.href='jogo2.html'">
            <div class="emoji">❓</div>
            <h2>Novo Jogo</h2>
            <p>Em breve...</p>
        </div>
    </div>
</body>
</html>
